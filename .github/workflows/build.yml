name: Build YT-DLP Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: ytdlp-studio

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxcb-cursor0 libxcb-xinerama0 \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 fuse libfuse2 file

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller>=6.0

      - name: Smoke test
        run: |
          python -c "import PySide6, yt_dlp; print('imports ok')"
          python -c "from src.options import build_ydl_opts, default_settings; print('mapping ok')"

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "${APP_NAME}" \
            --collect-all yt_dlp \
            main.py

      - name: List dist
        run: ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ runner.os }}
          path: dist/*
          retention-days: 30
